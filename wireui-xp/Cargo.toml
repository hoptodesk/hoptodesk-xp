[package]
name = "wireui-xp"
version = "0.5.57"
edition = "2021"
publish = false
description = "pure-Rust UI engine, CPU-render only, Windows XP capable"
license = "MIT"

[lib]
name = "sciter"

[dependencies]
regress = "=0.10.0"
slotmap = "1.0"
taffy = "0.5"
kurbo = "=0.11.3"
peniko = "=0.2.0"
tiny-skia = { version = "0.11", default-features = false, features = ["std", "simd"] }
skrifa = "0.22"
parley = "0.2"
image = { version = "0.25", default-features = false, features = ["png", "ico"] }

[target.'cfg(target_os = "windows")'.dependencies]
winapi = { version = "0.3", features = ["winuser", "windef", "wingdi", "winbase", "libloaderapi", "shellapi", "commdlg", "shlobj", "objbase", "combaseapi", "timezoneapi"] }

[dev-dependencies]
tempfile = "3"

[workspace]

[profile.dev.package.objc2]
debug-assertions = false

[profile.dev.package.objc2-foundation]
debug-assertions = false
