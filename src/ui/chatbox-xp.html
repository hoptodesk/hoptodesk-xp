<html window-resizable>
<head>
<style>
    body {
        margin: 0;
        font-family: Tahoma, Helvetica, Verdana, Arial;
        size: *;
        flow: vertical;
    }
    #msgs {
        size: *;
        overflow-y: auto;
        padding: 8px;
        font-size: 12px;
        line-height: 1.5em;
        background: white;
    }
    div.msg { margin-bottom: 8px; }
    div.msg-name { font-weight: 600; font-size: 11px; }
    div.msg-name.them { color: #2C8CFF; }
    div.msg-name.me { color: #22C55E; }
    div.msg-time { color: #94A3B8; font-size: 10px; margin-left: 6px; }
    div.msg-text { margin-top: 2px; }
    #send-bar {
        flow: horizontal;
        padding: 6px 8px;
        border-top: 1px solid #E2E8F0;
        border-spacing: 4px;
        background: #F8F9FA;
    }
    #chat-input {
        width: *;
        height: 28px;
        border: 1px solid #CED4DA;
        border-radius: 4px;
        padding: 0 6px;
        font-size: 12px;
    }
    #chat-input:focus { border-color: #2C8CFF; }
    #send-btn {
        background: #2C8CFF;
        color: white;
        border: none;
        border-radius: 4px;
        padding: 0 12px;
        height: 28px;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
    }
    #send-btn:hover { background: #1A7AEF; }
    #send-btn:active { background: #0B6AD7; }
</style>
<script type="text/tiscript">
    var p = view.parameters;
    var msgs = p.msgs;
    var callback = p.callback;

    function escapeHtml(s) {
        return s.replace("&", "&amp;").replace("<", "&lt;").replace(">", "&gt;");
    }

    function renderMsgs() {
        var el = $(#msgs);
        var html = "";
        for (var i = 0; i < msgs.length; i++) {
            var m = msgs[i];
            var cls = m.name == "me" ? "me" : "them";
            var name = m.name == "me" ? "Me" : escapeHtml(m.name);
            html += "<div class=\"msg\">";
            html += "<div class=\"msg-name " + cls + "\">" + name + "<span class=\"msg-time\"> " + (m.time || "") + "</span></div>";
            html += "<div class=\"msg-text\">" + escapeHtml(m.text) + "</div>";
            html += "</div>";
        }
        el.html = html;
        var y = el.box(#height, #content) - el.box(#height, #client);
        if (y > 0) el.scrollTo(0, y);
    }

    view.refresh = renderMsgs;

    function doSend() {
        var inp = $(#chat-input);
        var text = (inp.value || "").trim();
        inp.value = "";
        if (text.length == 0) return;
        if (callback) callback(text);
        renderMsgs();
        inp.state.focus = true;
    }

    function self.closing() {
        view.windowState = View.WINDOW_HIDDEN;
        return false;
    }

    function self.ready() {
        try { view.windowIcon = self.url("icon.ico"); } catch(e) {}
        renderMsgs();
        $(#chat-input).state.focus = true;
    }
</script>
</head>
<body>
    <div id="msgs"></div>
    <div id="send-bar">
        <input type="text" id="chat-input" placeholder="Type a message..." />
        <button id="send-btn" accesskey="!RETURN">Send</button>
    </div>
    <script type="text/tiscript">
        $(#send-btn).onClick = function() { doSend(); };
        $(#chat-input).onKey = function(evt) {
            if (evt.type == Event.KEY_DOWN && evt.keyCode == 13) {
                doSend();
                return true;
            }
            return false;
        };
    </script>
</body>
</html>
