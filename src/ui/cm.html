<head>
<title>HopToDesk - Incoming Connection</title>
<style>
    body {
        margin: 0;
        overflow: hidden;
        font-family: Tahoma, Helvetica, Verdana, Arial;
        color: #333;
        background: #F3F4F6;
    }

    div.content {
        flow: horizontal;
        size: *;
    }

    div.left-panel {
        size: *;
        padding: 1em;
        border-spacing: 1em;
        overflow: hidden;
        position: relative;
        background: #F3F4F6;
    }

    div.right-panel {
        background: white;
        border-left: #CED4DA 1px solid;
        size: *;
        display: none;
    }

    div.icon-and-id {

        border-spacing: 1em;

        size: 96px;

        min-height: 96px;
        text-align: center;
        font-size: 48px;
        line-height: 96px;
        color: white;
        font-weight: bold;
        border-radius: 12px;
    }

    div.id-info {
        margin: * 0;
    }

    div.peer-name {
        font-weight: bold;
        font-size: 1.1em;
        color: #1E293B;
    }

    div.peer-id {
        color: #6C757D;
        font-size: 0.9em;

    div.connected-time {

    }

    div.permissions > div:active {

    }

    div.permissions > div.disabled {
        background: #CED4DA;
    }

        background-size: cover;
        background-repeat: no-repeat;
        display: block;

    }

    div.buttons {
        width: *;
        border-spacing: 0.5em;
        text-align: center;
    }

    div.buttons button {
        width: 140px;
        height: 48px;
        margin: 0.4em;
        font-weight: 600;
        font-size: 1.1em;
        border-radius: 8px;
        cursor: pointer;
    }

    button#btn-accept {
        background: #0D6EFD;
        color: white;
        border: none;
        font-size: 1.2em;
    }
    button#btn-accept:hover { background: #0B5ED7; }

    button#btn-reject {
        background: #0D6EFD;
        color: white;
        border: none;
        font-size: 1.2em;
    }
    button#btn-reject:hover { background: #0B5ED7; }

    button#btn-disconnect {
        width: 160px;
        background: #EF4444;
        color: white;
        font-size: 1.2em;
        border: none;
        border-radius: 8px;
        height: 40px;
        cursor: pointer;
    }
    button#btn-disconnect:hover { background: #DC2626; }
    button#btn-disconnect:active { opacity: 0.7; }

    #button-row {
        flow: horizontal;
        width: *;
        border-spacing: 12px;
        text-align: center;
        margin: 8px auto;
    }

    #disconnect-row {
        visibility: hidden;
        height: 0;
        overflow: hidden;
        text-align: center;
    }

    #cm-status {
        text-align: center;
        font-size: 12px;
        color: #666;
    }

    div.chaticon {
        position: absolute;
        right: 10px;
        top: 10px;
        size: 32px;
        background-color: #F3F4F6;
        cursor: pointer;
        text-align: center;
        line-height: 32px;
    }
    div.chaticon:hover { background: #E5E7EB; }

    div.chat-panel {
        padding: 12px;
        size: *;
        flow: vertical;
    }

    div.chat-panel .chat-title {
        font-weight: bold;
        font-size: 13px;
        color: #1E293B;
        margin-bottom: 8px;
    }

    #chat-msgs {
        background: #F9FAFB;
        border: 1px solid #E5E7EB;
        border-radius: 6px;
        padding: 8px;
        size: *;
        overflow-y: auto;
        font-size: 12px;
        line-height: 1.6em;
    }
    .chat-msg b { color: #007BFF; }

    #chat-input-row {
        flow: horizontal;
        border-spacing: 6px;
        margin-top: 8px;
    }

    #chat-input {
        width: *;
        height: 30px;
        border: 1px solid #CED4DA;
        border-radius: 6px;
        padding: 0 8px;
        font-size: 12px;
    }

    input:focus {
        border-color: #0D6EFD;
    }

    #btn-chat-send {
        background: #0D6EFD;
        color: white;
        border: none;
        border-radius: 6px;
        padding: 0 14px;
        height: 30px;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
    }
    #btn-chat-send:hover { background: #0B5ED7; }

    div.spacer {
        height: *;
    }

    .perm-label {
        font-size: 11px;
        color: #6C757D;
        margin-top: -6px;
    }

<script type="text/tiscript">
view.windowMinSize = (300, 450);
</script>
</head>
<body>
    <div class="content">
        <div class="left-panel">
            <div class="chaticon" id="chat-toggle">&#128172;</div>

            <div class="icon-and-id">
                <div class="icon" id="avatar" style="background: __AVATAR_COLOR__">__AVATAR_LETTER__</div>
                <div class="id-info">
                    <div class="peer-name" id="peer-name">__PEER_NAME__</div>
                    <div class="peer-id">(__PEER_ID__)</div>
                    <div class="connected-time">Connected <span id="time">00:00:00</span></div>
                </div>
            </div>

            <div style="height:8px"></div>

            <div class="perm-label">Permissions</div>
            <div class="permissions">
                <div id="perm-keyboard" title="Keyboard &amp; Mouse"><icon class="keyboard" /></div>
                <div id="perm-clipboard" title="Clipboard"><icon class="clipboard" /></div>
                <div id="perm-audio" title="Audio"><icon class="audio" /></div>
                <div id="perm-file" title="File Transfer"><icon class="file" /></div>
                <div id="perm-restart" title="Restart"><icon class="restart" /></div>
            </div>

            <div class="spacer"></div>

            <div id="cm-status">Waiting for your response...</div>

            <div id="button-row">
                <button id="btn-accept">Accept</button>
                <button id="btn-reject">Dismiss</button>
            </div>

            <div id="disconnect-row">
                <button id="btn-disconnect">Disconnect</button>
            </div>
        </div>

        <div class="right-panel" id="right-panel">
            <div class="chat-panel">
                <div class="chat-title">Chat</div>
                <div id="chat-msgs"></div>
                <div id="chat-input-row">
                    <input type="text" id="chat-input" placeholder="Type a message..." />
                    <button id="btn-chat-send">Send</button>
                </div>
            </div>
        </div>
    </div>

    <div id="accept-flag" style="visibility:hidden;height:0;overflow:hidden;"></div>
    <div id="reject-flag" style="visibility:hidden;height:0;overflow:hidden;"></div>
    <div id="disconnect-flag" style="visibility:hidden;height:0;overflow:hidden;"></div>
    <div id="chat-send-flag" style="visibility:hidden;height:0;overflow:hidden;"></div>
    <div id="perm-flag" style="visibility:hidden;height:0;overflow:hidden;"></div>

    <script type="text/tiscript">
        var show_chat = false;
        var connect_time = new Date();

        function self.ready() {
            var (sw, sh) = view.screenBox(#workarea, #dimension);
            var w = 300;
            var h = 450;
            view.move(sw - w, 0, w, h);
        }

        function updateTime() {
            self.timer(1000, function() {
                var now = new Date();
                var seconds = Date.diff(connect_time, now, #seconds);
                var hours = (seconds / 3600).toInteger();
                var minutes = ((seconds % 3600) / 60).toInteger();
                var secs = (seconds % 60).toInteger();
                var out = "";
                if (hours < 10) out += "0";
                out += hours + ":";
                if (minutes < 10) out += "0";
                out += minutes + ":";
                if (secs < 10) out += "0";
                out += secs;
                var el = $(#time);
                if (el) el.text = out;
                updateTime();
            });
        }
        updateTime();

        event click $(#chat-toggle) {
            show_chat = !show_chat;
            var rp = $(#right-panel);
            rp.style#display = show_chat ? "block" : "none";

            var (x, y, w, h) = view.box(#rectw, #border, #screen);
            if (show_chat && w < 600) {
                view.move(x - (600 - w), y, 600, h);
            } else if (!show_chat && w > 450) {
                view.move(x + (w - 300), y, 300, h);
            }
        }

        $(#btn-accept).onClick = function() {
            $(#accept-flag).text = "accept";
        };

        $(#btn-reject).onClick = function() {
            $(#reject-flag).text = "reject";
            view.close();
        };

        $(#btn-disconnect).onClick = function() {
            $(#disconnect-flag).text = "disconnect";
            view.close();
        };

        function sendChat() {
            var input = $(#chat-input);
            var text = input.text.trim();
            if (text.length > 0) {
                $(#chat-send-flag).text = text;
                input.text = "";
            }
        }

        $(#btn-chat-send).onClick = function() {
            sendChat();
        };

        $(#chat-input).onKey = function(evt) {
            if (evt.type == Event.KEY_DOWN && evt.keyCode == 13) {
                sendChat();
                return true;
            }
            return false;
        };

        function togglePerm(el, name) {
            var isDisabled = el.attributes.hasClass("disabled");
            if (isDisabled) {
                el.attributes.removeClass("disabled");
            } else {
                el.attributes.addClass("disabled");
            }
            var enabled = isDisabled ? "1" : "0";
            $(#perm-flag).text = name + "|" + enabled;
        }

        event click $(#perm-keyboard) { togglePerm(this, "keyboard"); }
        event click $(#perm-clipboard) { togglePerm(this, "clipboard"); }
        event click $(#perm-audio) { togglePerm(this, "audio"); }
        event click $(#perm-file) { togglePerm(this, "file"); }
        event click $(#perm-restart) { togglePerm(this, "restart"); }

        function self.closing() {
            view.windowState = View.WINDOW_HIDDEN;
            return false;
        }
    </script>
</body>
</html>
