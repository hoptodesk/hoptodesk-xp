<html window-resizable>
<head>
<title>HopToDesk</title>
<style>
    body {
        margin: 0;
        overflow: hidden;
        font-family: Tahoma, Helvetica, Verdana, Arial;
        background: #0F172A;
    }

    #header-bar {
        display: none;
        height: 40px;
        background: white;
        border-bottom: 1px solid #E2E8F0;
        flow: horizontal;
        padding: 0 6px;
        border-spacing: 2px;
        position: relative;
        z-index: 100;
    }

    #peer-pill {
        height: 28px;
        max-width: 150px;
        margin: * 4px;
        padding: 0 10px 0 8px;
        background: #F1F5F9;
        border-radius: 14px;
        flow: horizontal;
        border-spacing: 5px;
    }

    #peer-lock {
        width: 14px;
        height: 14px;
        margin: * 0;
    }

    #peer-name {
        margin: * 0;
        font-size: 12px;
        font-weight: 600;
        color: #1E293B;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
    }

    .tb-btn {
        width: 30px;
        height: 30px;
        margin: * 0;
        padding: 0;
        background: transparent;
        border: none;
        border-radius: 6px;
        color: #475569;
        cursor: pointer;
        text-align: center;
    }

    .tb-btn svg {
        width: 17px;
        height: 17px;
        margin: * 0;
    }

    .tb-btn:hover { background: #F1F5F9; }
    .tb-btn:active { background: #E2E8F0; }

    .tb-danger { color: #EF4444; }
    .tb-danger:hover { background: #FEF2F2; }
    .tb-danger:active { background: #FEE2E2; }

    .tb-sep { width: 1px; height: 20px; background: #E2E8F0; margin: * 3px; }
    .tb-spacer { width: *; }

    #chat-panel {
        display: none;
        position: absolute;
        right: 0;
        top: 40px;
        bottom: 0;
        width: 280px;
        background: white;
        border-left: 1px solid #E2E8F0;
        flow: vertical;
        z-index: 50;
    }
    #chat-header {
        padding: 8px 12px;
        font-weight: 600;
        font-size: 13px;
        border-bottom: 1px solid #E2E8F0;
        color: #1E293B;
    }
    #chat-msgs-view {
        size: *;
        overflow-y: auto;
        padding: 8px;
        font-size: 12px;
        line-height: 1.5em;
    }
    #chat-msgs-view div.chat-msg { margin-bottom: 6px; }

        flow: horizontal;
        padding: 6px 8px;
        border-top: 1px solid #E2E8F0;
        border-spacing: 4px;
    }
    #chat-input {
        width: *;
        height: 28px;
        border: 1px solid #CED4DA;
        border-radius: 4px;
        padding: 0 6px;
        font-size: 12px;
    }
    #chat-send-btn {
        background: #2C8CFF;
        color: white;
        border: none;
        border-radius: 4px;
        padding: 0 12px;
        height: 28px;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
    }
    #chat-send-btn:hover { background: #1A7AEF; }

    #canvas {
        position: absolute;
        left: 0;
        top: 40px;
        right: 0;
        bottom: 0;
        background: transparent;
        cursor: default;
    }

    #status-overlay {
        position: absolute;
        left: 0;
        top: 0;
        right: 0;
        bottom: 0;
        background: #0F172A;
        color: white;
        font-size: 16px;
        text-align: center;
        vertical-align: middle;
        z-index: 200;
    }

    #password-overlay {
        display: none;
        position: absolute;
        left: 0;
        top: 0;
        right: 0;
        bottom: 0;
        background: #0F172A;
        text-align: center;
        vertical-align: middle;
        z-index: 300;
    }

    #password-dialog {
        width: 320px;
        background: white;
        border: 1px solid #475569;
        border-radius: 8px;
        padding: 24px;
        margin: * auto;
    }

    #pw-title {
        font-size: 14px;
        font-weight: 600;
        color: #1E293B;
        margin-bottom: 4px;
    }

    #pw-message {
        font-size: 12px;
        color: #6C757D;
        margin-bottom: 16px;
    }

    #pw-input-wrap {
        flow: horizontal;
        border: 1px solid #CED4DA;
        border-radius: 4px;
        margin-bottom: 12px;
        padding: 0;
    }

    #pw-input {
        width: *;
        height: 32px;
        border: none;
        padding: 0 8px;
        font-size: 13px;
    }

    #pw-eye {
        width: 32px;
        height: 32px;
        border: none;
        background: transparent;
        cursor: pointer;
        color: #9CA3AF;
        text-align: center;
    }

    #pw-eye svg {
        width: 16px;
        height: 16px;
        margin: * 0;
    }

    #pw-eye:hover {
        color: #6C757D;
    }

    #pw-remember-wrap {
        flow: horizontal;
        margin-bottom: 16px;
        font-size: 12px;
        color: #374151;
        border-spacing: 6px;
    }

    #pw-buttons {
        flow: horizontal;
        border-spacing: 8px;
    }

    #pw-buttons button {
        width: *;
        height: 32px;
        border-radius: 4px;
        font-size: 13px;
        cursor: pointer;
        border: 1px solid #CED4DA;
    }

    #pw-cancel {
        background: white;
        color: #374151;
    }

    #pw-cancel:hover {
        background: #F3F4F6;
    }

    #pw-submit {
        background: #0D6EFD !important;
        color: white !important;
        border-color: #0D6EFD !important;
        font-weight: 600;
    }

    #pw-submit:hover {
        background: #0B5ED7 !important;
    }

    .hidden-flag {
        visibility: hidden;
        height: 0;

    }

    #file-transfer-wrapper {

        top: 40px;
        right: 0;
        bottom: 0;
        background: #F3F4F6;
        flow: vertical;
        padding: 6px;
        border-spacing: 6px;
    }

    #file-transfer {
        size: *;
        flow: horizontal;
        border-spacing: 6px;
    }

    .ft-section {
        size: *;
        background: white;
        border-radius: 8px;
        padding: 8px;
        border-spacing: 6px;

    }

    .ft-title {

        border-spacing: 8px;

    }

    .ft-title span {
        margin: * 0;
        color: #6C757D;
        font-weight: 600;

    }

    .ft-toolbar {
        flow: horizontal;
        border-spacing: 4px;
    }

    .ft-toolbar button {
        border: none;
        background: transparent;
        cursor: pointer;
    }

    .ft-ibtn {
        width: 26px;
        height: 26px;
        padding: 0;
        border-radius: 4px;
        color: #475569;
        text-align: center;
    }

    .ft-ibtn:hover {
        background: #E5E7EB;
    }

    .ft-ibtn svg {
        width: 15px;
        height: 15px;
        margin: * 0;
    }

    .ft-toolbar .ft-path {
        width: *;
        height: 24px;
        border: 1px solid #CED4DA;
        border-radius: 4px;
        padding: 0 6px;
        font-size: 11px;
    }

    .ft-toolbar .ft-path:focus {

    }

    .ft-send-btn {
        background: white !important;

        border-radius: 4px;
        padding: 4px 12px;
        font-size: 11px;
        color: #0D6EFD;
        font-weight: 600;
    }

    .ft-send-btn:hover {
        background: #0D6EFD !important;
        color: white !important;
    }

    .ft-table {
        size: *;
        border: 1px solid #E5E7EB;
        border-radius: 6px;
        overflow: hidden;
        flow: vertical;
    }

    .ft-thead {
        flow: horizontal;
        background: #F7F8FA;
        border-bottom: 1px solid #E5E7EB;
        padding: 6px 8px;
        font-weight: 600;
        font-size: 11px;
        color: #6C757D;
    }

    .ft-thead .ft-col-icon { width: 24px; }
    .ft-thead .ft-col-name { width: *; }
    .ft-thead .ft-col-date { width: 110px; }
    .ft-thead .ft-col-size { width: 64px; text-align: right; }

    .ft-tbody {
        size: *;
        overflow-y: auto;
        overflow-x: hidden;
        background: white;
    }

    .ft-row {
        flow: horizontal;
        min-height: 26px;
        padding: 2px 8px;
        font-size: 12px;
        color: #1E293B;
        cursor: pointer;
        border-bottom: 1px solid #F3F4F6;
    }

    .ft-row > div {
        margin: * 0;
    }

    .ft-col-icon svg {
        width: 15px;
        height: 15px;
        margin: * 0;
    }

    .ft-row:hover {
        background: #F0F7FF;
    }

    .ft-row.selected {
        background: #E3F2FD;
        color: #1E293B;
    }

    .ft-col-icon { width: 24px; min-width: 24px; text-align: center; }
    .ft-col-name { size: *; color: #1E293B; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .ft-col-date { width: 110px; min-width: 110px; color: #9CA3AF; font-size: 11px; }
    .ft-col-size { width: 64px; min-width: 64px; text-align: right; color: #9CA3AF; font-size: 11px; }

    .ft-icon-folder { color: #F59E0B; }
    .ft-icon-file { color: #6B7280; }

    #job-table {
        min-height: 60px;
        max-height: 140px;
        background: white;
        border: 1px solid #E5E7EB;
        border-radius: 6px;
        overflow-y: auto;
        padding: 4px;
    }

    .job-row {
        padding: 4px 8px;
        border-bottom: 1px solid #F3F4F6;
        font-size: 11px;
        color: #007BFF;
    }

    .job-status-finished {
        color: #28A745;
    }

    .job-status-error {
        color: #EF4444;
    }
</style>
</head>

        var video_off_x_el = $(#video-offset-x);
        var video_off_y_el = $(#video-offset-y);

        view.windowMinSize = (500, 250);

        var local_selected = -1;

        var remote_entries = [];
        var remote_selected = -1;

        function getSize(size) {
            if (!size) return "";
            size = size.toFloat();
            if (size < 1024) return size.toInteger() + "B";
            if (size < 1024 * 1024) return (size / 1024).toInteger() + "K";
            if (size < 1024 * 1024 * 1024) return ((size / (1024 * 1024)) * 10).toInteger() / 10.0 + "M";
            return ((size / (1024 * 1024 * 1024)) * 10).toInteger() / 10.0 + "G";

        function joinPath(base, name) {
            if (!base || base == "/") return name;

            var sep = (base.indexOf("/") >= 0) ? "/" : "\\";
            if (base[base.length - 1] == "\\" || base[base.length - 1] == "/") return base + name;
            return base + sep + name;
        }

        function sendFiles(path, is_remote) {
            var to;
            if (is_remote) {
                to = local_path;
            } else {
                to = remote_path;
            }
            if (!to) return;

            var fileName = path;
            var sep = path.lastIndexOf("\\");
            if (sep < 0) sep = path.lastIndexOf("/");
            if (sep >= 0) fileName = path.substr(sep + 1);

            to = joinPath(to, fileName);

            var id = next_job_id;
            next_job_id += 1;

            var job = {
                id: id,
                path: path,
                to: to,
                is_remote: is_remote,
                finished: false,
                error: null,
                entries: null,
                total_size: 0,
                finished_size: 0,
                file_num: 0,
                num_entries: 0,
                speed: 0
            };
            jobs.push(job);
            job_map[id] = job;

            $(#ft-send-files).text = id + "|" + path + "|" + to + "|0|" + (show_hidden ? "1" : "0") + "|" + (is_remote ? "1" : "0");
            updateJobDisplay();
        }

        function updateJobDisplay() {
            var html = "";
            for (var i = 0; i < jobs.length; i++) {
                var job = jobs[i];

                var arrow = job.is_remote ? "\u2190" : "\u2192";

                var status = "Waiting...";
                var statusClass = "job-status";
                if (job.finished) {
                    if (job.error) {
                        status = "Error: " + job.error;
                        statusClass = "job-status-error";
                    } else {
                        status = "Finished";
                        if (job.entries && job.entries.length > 0) {
                            var n = job.num_entries || job.entries.length;
                            status += " " + n + " file" + (n > 1 ? "s" : "");
                            if (job.total_size > 0) status += ", " + getSize(job.total_size);
                        }
                        statusClass = "job-status-finished";
                    }
                } else if (job.entries && job.entries.length > 0) {
                    var n = job.num_entries || job.entries.length;
                    var fn = job.file_num + 1;
                    if (fn > n) fn = n;
                    status = fn + " / " + n + " files";
                    if (job.total_size > 0) {
                        var pct = ((100.0 * job.finished_size / job.total_size)).toInteger();
                        status += ", " + getSize(job.finished_size) + " / " + getSize(job.total_size) + ", " + pct + "%";
                    }
                    if (job.speed > 0) status += ", " + getSize(job.speed) + "/s";
                }

                var displayPath = job.path;
                var sep = displayPath.lastIndexOf("\\");
                if (sep < 0) sep = displayPath.lastIndexOf("/");
                if (sep >= 0) displayPath = displayPath.substr(sep + 1);

                html += "<div class=\"job-row " + statusClass + "\">";
                html += arrow + " " + escapeHtml(displayPath) + " - " + status;
                html += "</div>";
            }
            if (html == "") html = "<div class=\"job-row\" style=\"color:#6B7280\">No transfers</div>";
            $(#job-table).html = html;
        }

        canvas.onMouse = function(evt) {
            var frame_w = (frame_w_el.text || "0").toInteger();
            var frame_h = (frame_h_el.text || "0").toInteger();
            if (frame_w <= 0 || frame_h <= 0) return false;

            var cw = canvas.box(#width, #border);
            var ch = canvas.box(#height, #border);
            if (cw <= 0 || ch <= 0) return false;

            var mask = -1;
            var wheel_dx = 0;
            var wheel_dy = 0;

            switch(evt.type) {
                case Event.MOUSE_DOWN:
                    mask = 1;
                    break;
                case Event.MOUSE_UP:
                    mask = 2;
                    break;
                case Event.MOUSE_MOVE:
                    mask = 0;
                    break;
                case Event.MOUSE_WHEEL:
                    mask = 3;
                    {
                        var (dx, dy) = evt.wheelDeltas;
                        if (dx > 3) dx = 3;
                        else if (dx < -3) dx = -3;
                        if (dy > 3) dy = 3;
                        else if (dy < -3) dy = -3;
                        wheel_dx = dx.toInteger();
                        wheel_dy = dy.toInteger();
                        if (wheel_dx == 0 && wheel_dy == 0) return true;
                    }
                    break;
                case Event.MOUSE_DCLICK:
                    mask = 1;
                    break;
                case Event.MOUSE_ENTER:
                    entered = true;
                    return true;
                case Event.MOUSE_LEAVE:
                    entered = false;
                    return true;
                default:
                    return false;
            }

            if (mask < 0) return false;

            var x = 0;
            var y = 0;

            if (mask == 0) {
                var off_x = (video_off_x_el.text || "0").toInteger();
                var off_y = (video_off_y_el.text || "0").toInteger();
                var scale_w = (video_scale_w_el.text || "0").toInteger();
                var scale_h = (video_scale_h_el.text || "0").toInteger();
                if (scale_w > 0 && scale_h > 0) {
                    x = (((evt.x.toFloat() - off_x) / scale_w) * frame_w).toInteger();
                    y = (((evt.y.toFloat() - off_y) / scale_h) * frame_h).toInteger();
                } else {
                    x = ((evt.x.toFloat() / cw) * frame_w).toInteger();
                    y = ((evt.y.toFloat() / ch) * frame_h).toInteger();
                }
                if (x < 0) x = 0;
                if (y < 0) y = 0;
                if (x >= frame_w) x = frame_w - 1;
                if (y >= frame_h) y = frame_h - 1;
            } else if (mask == 3) {
                x = wheel_dx;
                y = wheel_dy;
            }

            var buttons = evt.buttons || 1;
            var alt = evt.altKey ? 1 : 0;
            var ctrl = evt.ctrlKey ? 1 : 0;
            var shift = evt.shiftKey ? 1 : 0;

            mouse_el.text = mask + "," + x + "," + y + "," + buttons + "," + alt + "," + ctrl + "," + shift;
            return true;
        };

            }
        }

        event click $(#pw-cancel) {
            hidePasswordDialog();
            $(#disconnect-flag).text = "1";
        }

        $(#pw-input).onKey = function(evt) {
            if (evt.type == Event.KEY_DOWN && evt.keyCode == 13) {
                var pw = this.value || "";
                if (pw.length > 0) {
                    hidePasswordDialog();
                    $(#status-overlay).text = "Connecting...";
                    $(#status-overlay).style#color = "white";
                    showEl($(#status-overlay));
                    $(#retry-password).text = pw;
                }
                return true;
            }
            return false;
        };


        if (IS_FT) {
            hideEl($(#canvas));
            hideEl($(#status-overlay));
            hideEl($(#header-bar));
            showEl($(#file-transfer-wrapper));
            $(#file-transfer-wrapper).style#top = "0px";
            view.windowCaption = "File Transfer";
            readLocalDir(HOME_DIR);
            readRemoteDir("");
        }

        self.updateFolderFiles = updateFolderFiles;
        self.updateLocalFolderFiles = updateLocalFolderFiles;
        self.jobDone = jobDone;
        self.jobError = jobError;
        self.jobProgress = jobProgress;
        self.overrideFileConfirm = overrideFileConfirm;
        self.showPasswordDialog = showPasswordDialog;


        $(#tb-fullscreen).onClick = function() {
            if (view.windowState == View.WINDOW_FULL_SCREEN) {
                view.windowState = View.WINDOW_SHOWN;
                this.attributes["title"] = "Full Screen";
            } else {
                view.windowState = View.WINDOW_FULL_SCREEN;
                this.attributes["title"] = "Exit Full Screen";
            }
        };

        $(#tb-ctrl-alt-del).onClick = function() {
            $(#key-event).text = "cad";
        };

        $(#tb-transfer).onClick = function() {
            $(#transfer-flag).text = "1";
        };

        $(#tb-chat).onClick = function() {
            startChat();
        };

        $(#tb-restart).onClick = function() {
            view.msgbox(#question, "Restart", "Are you sure you want to restart the remote computer?", function(res) {
                if (res) $(#key-event).text = "restart";
            });
        };

        $(#tb-lock).onClick = function() {
            $(#key-event).text = "lock";
        };

        $(#tb-screenshot).onClick = function() {
            $(#screenshot-flag).text = "1";
        };

        $(#tb-switch-sides).onClick = function() {
            $(#switch-sides-flag).text = "1";
        };

        if (!DASHBOARD_LINKED) {
            $(#tb-add-dashboard).style#display = "none";
        }
        $(#tb-add-dashboard).onClick = function() {
            $(#add-dashboard-flag).text = "1";
        };

        $(#tb-disconnect).onClick = function() {
            $(#disconnect-flag).text = "disconnect";
        };

        self.updatePeerName = function(name) {
            $(#peer-name).text = name;
        };

        self.chatReceived = function(sender, text) {
            chat_msgs.push({text: text, name: sender, time: getNowStr()});
            startChat();
        };
    </script>
</body>
</html>
